[workspace]
resolver = "2"
members = ["crates/livehub-core", "crates/livehub-engine", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rustam <info@superduperai.co>"]
license = "MIT"

[workspace.dependencies]
# --- livehub's own stack ---
anyhow = "1"
thiserror = "1"
rtrb = "0.3"
atomic_float = "1"
arc-swap = "1"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = [
    "mp3", "flac", "wav", "pcm", "isomp4", "aac",
] }
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
clack-host = "0.1"
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "log", "clack-host"] }
clack-common = "0.1"
rusty_link = "0.4"
clap = { version = "4", features = ["derive"] }
rfd = "0.14"

# --- reuse: pure WASM-safe crates from the video-generator-agent workspace.
# Their `{ workspace = true }` deps resolve against THEIR workspace root (VG),
# so livehub does not (and must not) redeclare serde/strum/chrono. ---
video-core = { path = "../../../startups/active/video-generator-agent/crates/video-core" }
video-audio = { path = "../../../startups/active/video-generator-agent/crates/video-audio" }
