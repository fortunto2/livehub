[package]
name = "beam"
version.workspace = true
edition.workspace = true
license.workspace = true

# A tiny standalone window: capture an input device (BlackHole carrying REAPER,
# system audio, a hardware input) and UDP-stream it to the phone (reelcam) — no DJ
# console. Reuses livehub-engine's Broadcaster + Discovery.
[[bin]]
name = "beam"
path = "src/main.rs"

[dependencies]
livehub-engine = { path = "../crates/livehub-engine" }
anyhow = { workspace = true }
cpal = { workspace = true }   # also used by the `rx` diagnostic receiver
rtrb = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# eframe's `wgpu` feature ships wgpu with default-features off → enable Metal here
# (feature unification), same as the main app.
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }
