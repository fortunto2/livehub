[package]
name = "beam"
version.workspace = true
edition.workspace = true
license.workspace = true

# A tiny macOS menu-bar broadcaster: capture an input device (BlackHole carrying
# REAPER, system audio, a hardware input) and UDP-stream it to the phone (reelcam)
# — no DJ console. Reuses livehub-engine's Broadcaster + Discovery.
[[bin]]
name = "beam"
path = "src/main.rs"

[dependencies]
livehub-engine = { path = "../crates/livehub-engine" }
anyhow = { workspace = true }
tray-icon = "0.21"
winit = "0.30"
