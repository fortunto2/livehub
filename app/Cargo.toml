[package]
name = "livehub-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "livehub"
path = "src/main.rs"

[dependencies]
livehub-engine = { path = "../crates/livehub-engine" }
livehub-core = { path = "../crates/livehub-core" }
anyhow = { workspace = true }
clap = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
ffmpeg-next = "8"
image = "0.25"
# eframe's `wgpu` feature pulls wgpu with default-features off, which omits the
# native backend → "no wgpu backend enabled" panic at startup. Enable Metal here
# (feature unification turns it on across the graph).
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }
